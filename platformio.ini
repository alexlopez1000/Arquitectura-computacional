; ============================================================
; PlatformIO project configuration
; ============================================================
; MCU oficial [CONFIRMADO por el docente]: Arduino Mega 2560
; (ATmega2560). Ver docs/03_hallazgos.md H-09.
; ============================================================

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600

; Expone include/ tambien a las librerias: include/arduino.h resuelve el
; #include "arduino.h" (minusculas) de StateMachineLib en sistemas
; sensibles a mayusculas. Ver docs/03_hallazgos.md H-09.
build_flags = -I include

; Librerias oficiales [CONFIRMADO / ESTANDAR DE CLASE]:
; - MFRC522         : rfid-master.zip (miguelbalboa/rfid)
; - DHT             : Lab_DIG_TTM_02.pdf (Adafruit DHT, sensor DHT11)
; - LiquidCrystal   : LCD 16x2 en modo 4 bits
; - StateMachineLib : FSM del control de acceso (Luis Llamas)
; - AsyncTaskLib    : tareas asincronas no bloqueantes (Luis Llamas)
; - Average         : libreria local lib/Average/ (Average-master.zip)
; - Keypad          : NO se usa chris--a/Keypad; el escaneo matricial
;   se implementa en KeypadReader (patron de la clase 10).
; Sin RTC: toda la temporizacion usa millis().
lib_deps =
    miguelbalboa/MFRC522@^1.4.9
    adafruit/DHT sensor library@^1.4.6
    arduino-libraries/LiquidCrystal@^1.0.7
    luisllamasbinaburo/StateMachineLib@^1.0.0
    luisllamasbinaburo/AsyncTaskLib@^1.0.0
