; ============================================================
; PlatformIO project configuration
; ============================================================
; TODO [PENDIENTE D-05]: el microcontrolador oficial NO esta
; confirmado por el profesor. 'megaatmega2560' queda como
; PROPUESTA TECNICA (ATmega2560 soportado por el datasheet
; atmel-2549 presente en el directorio del curso).
; ============================================================

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600

; Librerias [ESTANDAR DE CLASE] verificadas en el material del curso:
; - MFRC522     : rfid-master.zip (miguelbalboa/rfid)
; - DHT         : Lab_DIG_TTM_02.pdf (Adafruit DHT)
; - LiquidCrystal: libreria estandar de Arduino IDE (LCD16x2)
; - Average     : Average-master.zip (filtrado de sensores)
; TODO [PENDIENTE D-05]: RTC DS3231 (Wire) pendiente de confirmar.
; TODO [PENDIENTE D-04]: framework de concurrencia (cooperativo
; vs FreeRTOS) pendiente; por ahora no se declaran dependencias RTOS.
lib_deps =
    miguelbalboa/MFRC522@^1.4.9
    adafruit/DHT sensor library@^1.4.6
